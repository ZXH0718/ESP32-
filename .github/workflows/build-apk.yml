name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Expo Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --no-install --skip-dependency-update react,react-native,expo
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dino-runner-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dino-runner-apk
          path: dino-runner-v1.0.0.apk
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dino-runner-v1.0.0.apk
          tag_name: v1.0.0
          name: 🦖 恐龙快跑 v1.0.0
          body: |
            自动构建生成的 APK 安装包。
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
