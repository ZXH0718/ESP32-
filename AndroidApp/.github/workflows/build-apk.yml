name: 一键编译APK (BLE版)

on:
  workflow_dispatch:
  push:
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Gradle 项目结构
        run: |
          # 将 AndroidApp 目录下的文件复制到工作区根目录构建
          mkdir -p app/src/main/java/com/esp32/musicbox
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 复制源码文件（直接从仓库读取，确保与本地一致）
          cp AndroidApp/app/src/main/java/com/esp32/musicbox/MainActivity.kt app/src/main/java/com/esp32/musicbox/
          cp AndroidApp/app/src/main/AndroidManifest.xml app/src/main/
          cp AndroidApp/app/src/main/res/layout/activity_main.xml app/src/main/res/layout/
          cp AndroidApp/app/src/main/res/values/strings.xml app/src/main/res/values/
          cp AndroidApp/app/src/main/res/values/colors.xml app/src/main/res/values/
          cp AndroidApp/app/src/main/res/values/themes.xml app/src/main/res/values/
          cp AndroidApp/app/src/main/res/drawable/bg_status_dot.xml app/src/main/res/drawable/

      - name: 生成 Gradle 配置文件
        run: |
          cat > settings.gradle << 'ENDFILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MusicSender"
          include(":app")
          ENDFILE

          cat > build.gradle << 'ENDFILE'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          ENDFILE

          cat > gradle.properties << 'ENDFILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ENDFILE

          cat > app/build.gradle << 'ENDFILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.esp32.musicbox"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.esp32.musicbox"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2.0-BLE"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
              buildFeatures {
                  viewBinding = true
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.activity:activity-ktx:1.8.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
          }
          ENDFILE

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 下载 Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: 下载 Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

      - name: 安装构建工具
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 编译 APK
        run: gradle assembleRelease
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_MusicBox_BLE_APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
